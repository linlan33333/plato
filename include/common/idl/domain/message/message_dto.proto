syntax = "proto3";

import "user_dto.proto";
// import "include/common/idl/domain/user/user_dto.proto";
import public "google/protobuf/timestamp.proto";

// 与接入层的message撞了
package message;

// 消息域的聚合
// 因为不用考虑session会话问题，所以聚合根就应当是messageID，至于messageID怎么来的
// writer server应当在接收到消息后请求redis分配msgID才对
message MessageDTO {
    uint64 messageID = 1;

    // 发送者的id，发送者的个人资料如头像昵称啥的目前不确定要不要有这个字段，
    // 因为单聊场景不需要，单聊都是自己联系人，用户终端就有备注后的头像昵称数据
    // 但群聊一般都是非好友发的消息居多，非好友的头像昵称应当随着消息一起携带出去，
    // 这怎么设计呢？是添加头像昵称字段还是不添加呢？
    uint64 userID = 2;
    .user.InformationDTO information = 3;   // 用户的个人资料DTO，先放这放着，后续修改

    // 消息的类型
    MessageType type = 4;
    // 该条消息具体内容
    string content = 5;
	// 发送时间戳，该字段由IM server设置好
    google.protobuf.Timestamp timestamp = 6;
}

// 消息类型，这是文本消息还是颜文字还是多媒体，甚至直播场景中的礼物、打赏消息等类型
// 都可以在这里定义，因为支持按消息类型写入最终一致或因果一致存储，所以可扩展这个东西
// 但目前只实现按因果一致性存储
enum MessageType {
    TEXT = 0;
    EMOJI = 1;
    MULTIMEDIA = 2;
}
